<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Akademik Komut Geliştirici</title><style>html,body{margin:0;height:100%;background:#f6f7fb}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}</style></head><body><iframe id="app" src="https://htmlpreview.github.io/?https://github.com/tdirsehan/tdirsehan/blob/main/akademik-komut-gelistirici-v3.html" title="Akademik Komut Geliştirici"></iframe><script>const app=document.getElementById('app');const toneByTemplate={academic:'Akademik ve temkinli',literature:'Akademik ve temkinli',article:'Yaratıcı ve ikna edici',reviewer:'Eleştirel ve analitik',general:'Kısa ve doğrudan'};const providerUrls={ChatGPT:'https://chatgpt.com/',Gemini:'https://gemini.google.com/',Claude:'https://claude.ai/',Grok:'https://grok.com/'};app.addEventListener('load',()=>{try{const d=app.contentDocument,w=app.contentWindow;if(!d)return;const oldTone=d.getElementById('tone');if(oldTone&&oldTone.tagName!=='SELECT'){const s=d.createElement('select');s.id='tone';s.innerHTML='<option value="">Üslup seçiniz</option><option>Akademik ve temkinli</option><option>Resmî ve profesyonel</option><option>Kısa ve doğrudan</option><option>Eleştirel ve analitik</option><option>Yaratıcı ve ikna edici</option><option>Öğretici ve sade</option>';oldTone.replaceWith(s);const key=d.getElementById('template')?.value||'academic';s.value=toneByTemplate[key]||'';s.addEventListener('change',()=>{if(typeof w.render==='function')w.render()})}const load=d.getElementById('load');if(load){load.addEventListener('click',()=>setTimeout(()=>{const key=d.getElementById('template')?.value||'academic';const tone=d.getElementById('tone');if(tone)tone.value=toneByTemplate[key]||'';if(typeof w.render==='function')w.render()},0))}const note=d.querySelector('.note');if(note)note.textContent='Komut önce ayrı bir “Komut Kodu” ekranında gösterilir ve panoya kopyalanır. Ardından ilgili yapay zekâyı açabilirsiniz.';d.querySelectorAll('.ai').forEach(old=>{const name=old.dataset.name||old.textContent.replace(' ile Aç','').replace(' Aç','').trim();old.textContent=name+' Aç';const b=old.cloneNode(true);old.replaceWith(b);b.addEventListener('click',async()=>{if(typeof w.render==='function')w.render();let text='';try{if(typeof w.build==='function'&&typeof w.data==='function')text=w.build(w.data())}catch(e){}if(!text){const out=d.getElementById('output');text=out?out.textContent:''}try{localStorage.setItem('akademikKomutTransfer',text)}catch(e){}try{await navigator.clipboard.writeText(text)}catch(e){}const t='https://htmlpreview.github.io/?https://github.com/tdirsehan/tdirsehan/blob/main/ai-komut-kodu.html?provider='+encodeURIComponent(name);window.open(t,'_blank','noopener,noreferrer')})});if(typeof w.render==='function')w.render()}catch(e){console.warn(e)}});</script></body></html>
