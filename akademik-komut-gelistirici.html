<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Akademik Komut Geliştirici</title><meta name="theme-color" content="#2563eb"><style>html,body{margin:0;height:100%;background:#f6f7fb;font-family:system-ui,-apple-system,sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}</style></head><body><iframe id="app" src="./promptlab.html" title="Akademik Komut Geliştirici"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{try{const d=frame.contentDocument,w=frame.contentWindow;if(!d)return;d.title='Akademik Komut Geliştirici';const h=d.querySelector('h1');if(h)h.textContent='Akademik Komut Geliştirici';const sub=d.querySelector('.subtitle');if(sub)sub.textContent='Akademik ve profesyonel komut geliştirme aracı';const replacements=[['Prompt Kalite Puanı','Komut Kalite Puanı'],['Oluşturulan Prompt','Oluşturulan Komut'],['Promptu Kopyala','Komutu Kopyala']];d.querySelectorAll('*').forEach(el=>{if(el.children.length===0){replacements.forEach(([a,b])=>{if(el.textContent.trim()===a)el.textContent=b})}});const ph={purpose:'Nihai hedefi ve başarı ölçütünü yazın.',role:'Gerekli uzmanlık, rol veya bakış açısını tanımlayın.',task:'Yapılacak işi, kapsamını ve beklenen eylemi açıkça yazın.',context:'Görevin anlaşılması için gerekli arka planı ve koşulları yazın.',evidence:'Hangi kaynakların kullanılacağını ve bilgilerin nasıl doğrulanacağını belirtin.',constraints:'Sınırları, yasakları, öncelikleri ve yapılmaması gerekenleri belirtin.',format:'Yanıtın hangi başlıklarla, sırada ve biçimde sunulacağını yazın.',quality:'Yanıtın teslimden önce hangi ölçütlerle kontrol edileceğini yazın.'};Object.entries(ph).forEach(([id,v])=>{const x=d.getElementById(id);if(x)x.placeholder=v});const tip=d.querySelector('.template-note');if(tip)tip.textContent='İpucu: Her başlık yalnızca kendi işlevini taşısın. Amaç hedefi, Görev yapılacak işi, Bağlam koşulları, Kanıt dayanakları, Kısıtlar sınırları ve Kalite Kontrolü son denetimi tanımlar.';const T={academic:{purpose:'Belirlenen akademik problem için teorik olarak anlamlı, yöntemsel olarak uygulanabilir ve açık biçimde raporlanabilir bir araştırma çıktısı üretmek.',role:'İlgili disiplinin literatürüne, teori geliştirmeye ve araştırma yöntemlerine hâkim; kanıtları eleştirel değerlendiren kıdemli bir akademik araştırma danışmanı olarak görev yap.',task:'Kullanıcının verdiği araştırma problemini analiz et; araştırma sorusunu netleştir, uygun teorik çerçeveyi belirle, araştırma boşluğunu ihtiyatlı biçimde gerekçelendir ve uygulanabilir bir yöntem öner.',context:'Araştırma alanı, hedef dergi veya kitle, teorik yaklaşım, mevcut veri, örneklem, yöntem tercihleri, zaman ve kaynak sınırlılıkları kullanıcı tarafından sağlandığı ölçüde dikkate alınsın.',evidence:'Öncelikle hakemli akademik yayınlara ve gerektiğinde birincil/kurumsal kaynaklara dayan. Güncel iddiaları doğrula. Doğrulanamayan kaynak, DOI, bulgu veya araştırma boşluğu üretme; belirsizliği açıkça belirt.',constraints:'Basit değişken ekleme mantığına, gereksiz model karmaşıklığına, kanıtsız kesinlik ifadelerine ve veriyle test edilemeyecek iddialara kaçma. Teorik katkı ile ampirik uygulanabilirliği birlikte gözet.',format:'Çıktıyı sırasıyla: Araştırma Problemi, Araştırma Sorusu, Teorik Çerçeve, Potansiyel Research Gap, Önerilen Model/Yöntem, Beklenen Katkı, Sınırlılıklar ve Uygun Hedef Dergiler başlıkları altında sun.',quality:'Teslimden önce teorik tutarlılığı, kaynak doğruluğunu, yöntemin uygulanabilirliğini, iddiaların kanıt düzeyini, özgünlük riskini ve olası hakem eleştirilerini ayrı ayrı kontrol et.',tone:'Resmî, analitik, temkinli ve akademik'},literature:{purpose:'Belirli bir konuda mevcut bilgi birikimini güvenilir biçimde sentezlemek, literatürdeki örüntüleri ve doğrulanabilir araştırma boşluklarını görünür hale getirmek.',role:'Sistematik literatür taraması, bibliyometri, teori sentezi ve kaynak eleştirisi konusunda deneyimli bir akademik araştırmacı olarak görev yap.',task:'İlgili literatürü temalar, teoriler, yöntemler, örneklemler, bağlamlar ve temel bulgular açısından sınıflandır; ortak noktaları, çelişkileri, yöntemsel sınırlılıkları ve yeterince araştırılmamış alanları belirle.',context:'Konu, disiplin, tarih aralığı, coğrafi kapsam, veri tabanları, dahil etme/dışlama ölçütleri ve hedef yayın türü kullanıcı tarafından verildiği ölçüde dikkate alınsın.',evidence:'Hakemli ve güvenilir akademik yayınlara öncelik ver. Kaynak bilgilerini doğrula; uydurma referans, DOI veya bulgu üretme. Bir research gap yalnızca mevcut çalışmaların kapsamı karşılaştırılarak desteklenebiliyorsa güçlü biçimde ifade edilsin.',constraints:'Yalnızca makale özetlerini art arda sıralama. Betimleyici listeleme yerine sentez ve karşılaştırma yap. Hiç çalışılmamıştır gibi mutlak ifadeleri kapsamlı doğrulama olmadan kullanma.',format:'Çıktıyı: Kapsam, Ana Temalar, Kullanılan Teoriler, Yöntemsel Eğilimler, Tutarlı Bulgular, Çelişkili Bulgular, Araştırma Boşlukları ve Gelecek Araştırma Soruları başlıkları altında sun.',quality:'Her ana sonucun birden fazla kaynakla desteklenip desteklenmediğini, research gaplerin gerçekten literatürden türetilip türetilmediğini ve sentezin betimleme düzeyini aşıp aşmadığını kontrol et.',tone:'Sistematik, eleştirel, temkinli ve akademik'},article:{purpose:'Güncel literatüre dayanarak teorik katkı potansiyeli taşıyan, ampirik olarak test edilebilir ve yayın stratejisi açısından savunulabilir yeni makale fikirleri geliştirmek.',role:'Pazarlama, tüketici davranışı, teknoloji ve yapay zekâ araştırmalarında teori geliştirme ve araştırma tasarımı deneyimine sahip kıdemli bir akademik danışman olarak görev yap.',task:'En az 8 özgün makale fikri geliştir; her fikir için temel araştırma problemini, araştırma sorusunu, teorik mekanizmayı, potansiyel research gap'i, kavramsal modeli ve en uygun araştırma yöntemini öner.',context:'Kullanıcının araştırma alanları, mevcut veri veya örneklem erişimi, yöntem yetkinliği, hedef dergi düzeyi, zaman ve bütçe kısıtları ile güncel akademik tartışmalar dikkate alınsın.',evidence:'Fikirleri güncel hakemli literatürle karşılaştır. Özgünlük veya boşluk iddiası kesin doğrulanamıyorsa bunu potansiyel boşluk olarak belirt ve kapsamlı literatür taramasıyla doğrulanması gerektiğini yaz.',constraints:'Yalnızca X’in Y üzerindeki etkisine dayanan sıradan modellerden, yalnızca niyet ölçen basit kabul modellerinden ve teorik gerekçesi zayıf değişken yığınlarından kaçın. Mekanizma, paradoks, sınır koşulu, doğrusal olmayan ilişki veya davranışsal sonuç içeren fikirlere öncelik ver.',format:'Her fikir için: İngilizce Başlık, Araştırma Problemi, Araştırma Sorusu, Potansiyel Research Gap, Teorik Lens, Temel Mekanizma, Kavramsal Model, Yöntem, Beklenen Teorik Katkı, Hedef Dergiler, Risk Analizi ve 10 Üzerinden Puanlama ver.',quality:'Fikirleri özgünlük, teorik katkı, metodolojik uygulanabilirlik, veri toplama zorluğu, daha önce yapılmış olma riski ve desk rejection riski açısından karşılaştır; sonunda en güçlü 3 fikri ve tek bir öncelikli öneriyi seç.',tone:'Yaratıcı fakat kanıta dayalı, analitik ve temkinli akademik'},reviewer:{purpose:'Bir akademik makalenin bilimsel katkısını ve yayınlanabilirliğini adil, kanıta dayalı ve geliştirici bir hakemlik yaklaşımıyla değerlendirmek.',role:'İlgili alanda yayın ve hakemlik deneyimine sahip; araştırma etiği, teori, yöntem ve raporlama standartlarını bilen bağımsız bir akademik hakem olarak görev yap.',task:'Makalenin araştırma problemini, teorik katkısını, literatür kullanımını, hipotez/araştırma sorularını, yöntemini, analizlerini, bulgularını, tartışmasını ve yazım kalitesini ayrı ayrı değerlendir.',context:'Derginin amacı ve kapsamı, makale türü, araştırma yöntemi, örneklem, veri kaynağı ve yazarların iddia ettiği temel katkı dikkate alınsın.',evidence:'Eleştirileri öncelikle makalede görülebilen kanıtlara ve yerleşik metodolojik ilkelere dayandır. Metinde bulunmayan kusurları varsayma, kaynak uydurma ve kanıtsız etik ihlal iddiasında bulunma.',constraints:'Yazarlara yönelik kişisel veya küçümseyici dil kullanma. Aynı sorunu farklı maddelerde tekrarlama. Her önemli eleştiride sorunun neden önemli olduğunu ve mümkünse nasıl düzeltilebileceğini belirt.',format:'Çıktıyı: Genel Değerlendirme, Temel Güçlü Yönler, Major Comments, Minor Comments, Yöntemsel Kontrol, Yazara Önerilen Revizyon Öncelikleri ve Editöre Genel Öneri başlıkları altında sun.',quality:'Her eleştirinin doğruluğunu, önem düzeyini, metindeki dayanağını, uygulanabilirliğini ve adaletini kontrol et; major ve minor yorumların önem düzeyleriyle tutarlı olduğundan emin ol.',tone:'Yapıcı, bağımsız, profesyonel ve temkinli'},general:{purpose:'Kullanıcının ihtiyacını açık, doğru, uygulanabilir ve doğrudan kullanılabilir bir sonuca dönüştürmek.',role:'Görevin gerektirdiği uzmanlık alanlarını kullanan, varsayımlarını açıkça yöneten ve kullanıcı talimatlarını önceliklendiren dikkatli bir yardımcı olarak görev yap.',task:'Kullanıcının verdiği işi eksiksiz biçimde yerine getir; gerekli alt görevleri belirle ve yalnızca nihai amaca hizmet eden bilgileri üret.',context:'Kullanıcının sağladığı arka plan, hedef kitle, kullanım amacı, mevcut materyal, zaman, bütçe ve diğer sınırlamalar dikkate alınsın.',evidence:'Bilgiye dayalı iddialarda güvenilir ve güncel kaynaklara dayan; doğrulanması gereken noktaları ayır ve emin olunmayan bilgileri kesin gerçek gibi sunma.',constraints:'Gereksiz varsayım, tekrar, konu dışı ayrıntı ve kullanıcının açıkça istemediği içerikten kaçın. Çelişen talimatlarda kullanıcı tarafından belirtilen öncelikleri koru.',format:'Çıktıyı kullanıcının istediği biçimde sun; biçim belirtilmemişse kısa bir sonuç özeti, ana çıktı ve gerekli açıklamalar şeklinde açık ve taranabilir bir yapı kullan.',quality:'Yanıtı göndermeden önce doğruluk, eksiksizlik, talimata uyum, iç tutarlılık, uygulanabilirlik ve gereksiz içerik açısından kontrol et.',tone:'Açık, profesyonel, doğrudan ve temkinli'}};const ids=['purpose','role','task','context','evidence','constraints','format','quality','tone'];function applyTemplate(){const s=d.getElementById('templateSelect');const t=s&&T[s.value];if(!t)return;ids.forEach(id=>{const x=d.getElementById(id);if(x&&t[id]!=null)x.value=t[id]});if(typeof w.render==='function')w.render();if(typeof w.notify==='function')w.notify('Şablon başlıklara uygun olarak yüklendi.')}const load=d.getElementById('loadTemplate');if(load)load.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();applyTemplate()},true);applyTemplate();if(!d.getElementById('generateBtn')){const st=d.createElement('style');st.textContent='.generate-wrap{margin-top:16px}.generate-btn{width:100%;border:0;border-radius:12px;padding:15px 18px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 8px 18px rgba(37,99,235,.20)}.generate-btn:active{transform:translateY(1px)}.output.generated{outline:3px solid rgba(37,99,235,.22);box-shadow:0 0 0 6px rgba(37,99,235,.06)}';d.head.appendChild(st);const note=d.querySelector('.template-note');const wrap=d.createElement('div');wrap.className='generate-wrap';wrap.innerHTML='<button class="generate-btn" id="generateBtn" type="button">Komut Oluştur</button>';if(note)note.insertAdjacentElement('afterend',wrap);d.getElementById('generateBtn').addEventListener('click',()=>{if(typeof w.render==='function')w.render();const out=d.getElementById('output');if(out){out.classList.remove('generated');void out.offsetWidth;out.classList.add('generated');setTimeout(()=>out.classList.remove('generated'),1400);out.scrollIntoView({behavior:'smooth',block:'start'})}if(typeof w.notify==='function')w.notify('Komut oluşturuldu.');});}}catch(e){console.warn(e)}});</script></body></html>
