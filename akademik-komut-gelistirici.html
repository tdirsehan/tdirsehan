<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Akademik Komut Geliştirici</title><meta name="theme-color" content="#2563eb"><style>html,body{margin:0;height:100%;background:#f6f7fb;font-family:system-ui,-apple-system,sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}</style></head><body><iframe id="app" src="./promptlab.html" title="Akademik Komut Geliştirici"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{try{const d=frame.contentDocument,w=frame.contentWindow;if(!d)return;d.title='Akademik Komut Geliştirici';const h=d.querySelector('h1');if(h)h.textContent='Akademik Komut Geliştirici';const sub=d.querySelector('.subtitle');if(sub)sub.textContent='Akademik ve profesyonel komut geliştirme aracı';if(!d.getElementById('generateBtn')){const st=d.createElement('style');st.textContent='.generate-wrap{margin-top:16px}.generate-btn{width:100%;border:0;border-radius:12px;padding:15px 18px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 8px 18px rgba(37,99,235,.20)}.generate-btn:active{transform:translateY(1px)}.output.generated{outline:3px solid rgba(37,99,235,.22);box-shadow:0 0 0 6px rgba(37,99,235,.06)}';d.head.appendChild(st);const note=d.querySelector('.template-note');const wrap=d.createElement('div');wrap.className='generate-wrap';wrap.innerHTML='<button class="generate-btn" id="generateBtn" type="button">Komut Oluştur</button>';if(note)note.insertAdjacentElement('afterend',wrap);d.getElementById('generateBtn').addEventListener('click',()=>{if(typeof w.render==='function')w.render();const out=d.getElementById('output');if(out){out.classList.remove('generated');void out.offsetWidth;out.classList.add('generated');setTimeout(()=>out.classList.remove('generated'),1400);out.scrollIntoView({behavior:'smooth',block:'start'})}if(typeof w.notify==='function')w.notify('Komut oluşturuldu.');});}}catch(e){console.warn(e)}});</script></body></html>
