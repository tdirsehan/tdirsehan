<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">AcademIQ Tools by Prof. Dr. Taşkın Dirsehan</title>
  <desc id="desc">Six academic web tools supporting prompt development, keywords, titles, journal targeting, cover letters, and reviewer responses.</desc>
