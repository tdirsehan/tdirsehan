    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f5bd7"/>
      <stop offset="1" stop-color="#0b8a8f"/>
    </linearGradient>
  </defs>
