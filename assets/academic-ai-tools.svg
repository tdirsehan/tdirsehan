<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Academic AI Tools by Taşkın Dirsehan</title>
  <desc id="desc">Four academic web tools: Akademik Komut Geliştirici, Review Splitter, Abstract2Keywords, and Abstract2Journal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f5bd7"/>
      <stop offset="1" stop-color="#0b8a8f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" rx="4" fill="url(#accent)"/>
  <circle cx="1080" cy="72" r="110" fill="#0f5bd7" opacity="0.05"/>
  <circle cx="1140" cy="120" r="70" fill="#0b8a8f" opacity="0.07"/>
  <text x="54" y="70" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0b7080">ACADEMIC AI TOOL PORTFOLIO</text>
  <text x="54" y="126" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#10233f">Prof. Dr. Taşkın Dirsehan</text>
  <text x="54" y="164" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52657a">Practical web tools for research, reviewing, abstract development and journal selection</text>

  <g transform="translate(54,210)">
    <rect width="248" height="98" rx="18" fill="#ffffff" stroke="#b9cbe1"/>
    <circle cx="36" cy="34" r="20" fill="#e7f0ff"/>
    <text x="36" y="41" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0f5bd7">1</text>
    <text x="68" y="34" font-family="Arial" font-size="18" font-weight="700" fill="#10233f">Akademik Komut</text>
    <text x="68" y="58" font-family="Arial" font-size="18" font-weight="700" fill="#10233f">Geliştirici</text>
    <text x="68" y="80" font-family="Arial" font-size="13" fill="#617287">Prompt &amp; research workflow</text>
  </g>

  <g transform="translate(322,210)">
    <rect width="248" height="98" rx="18" fill="#ffffff" stroke="#b9d8d8"/>
    <circle cx="36" cy="34" r="20" fill="#e4f7f6"/>
    <text x="36" y="41" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0b8a8f">2</text>
    <text x="68" y="40" font-family="Arial" font-size="19" font-weight="700" fill="#10233f">Review Splitter</text>
    <text x="68" y="69" font-family="Arial" font-size="13" fill="#617287">Reviewer-response structuring</text>
  </g>

  <g transform="translate(590,210)">
    <rect width="248" height="98" rx="18" fill="#ffffff" stroke="#b9cbe1"/>
    <circle cx="36" cy="34" r="20" fill="#e7f0ff"/>
    <text x="36" y="41" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0f5bd7">3</text>
    <text x="68" y="40" font-family="Arial" font-size="19" font-weight="700" fill="#10233f">Abstract2Keywords</text>
    <text x="68" y="69" font-family="Arial" font-size="13" fill="#617287">Keyword generation from abstracts</text>
  </g>

  <g transform="translate(858,210)">
    <rect width="288" height="98" rx="18" fill="#ffffff" stroke="#b9d8d8"/>
    <circle cx="36" cy="34" r="20" fill="#e4f7f6"/>
    <text x="36" y="41" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0b8a8f">4</text>
    <text x="68" y="40" font-family="Arial" font-size="19" font-weight="700" fill="#10233f">Abstract2Journal</text>
    <text x="68" y="69" font-family="Arial" font-size="13" fill="#617287">Evidence-based journal matching</text>
  </g>
