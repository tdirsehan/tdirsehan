<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PromptLab v2</title><link rel="manifest" href="./promptlab-v2-manifest.webmanifest"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="PromptLab"><link rel="icon" href="./promptlab-icon.svg" type="image/svg+xml"><style>html,body{margin:0;height:100%;background:#f6f7fb;font-family:system-ui,-apple-system,sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}.installbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:50;display:flex;gap:10px;align-items:center;background:#0f172a;color:#fff;padding:11px 12px;border-radius:15px;box-shadow:0 10px 30px #0003}.itxt{flex:1;font-size:12px;line-height:1.3}.itxt small{display:block;color:#cbd5e1;margin-top:3px}.installbar button{border:0;border-radius:10px;padding:9px 12px;font-weight:700}.install{background:#2563eb;color:#fff}.close{background:transparent;color:#cbd5e1}@media(min-width:800px){.installbar{max-width:620px;left:50%;right:auto;transform:translateX(-50%)}}</style></head><body><iframe id="app" src="./promptlab.html" title="PromptLab"></iframe><div class="installbar" id="installBar"><div class="itxt"><b>PromptLab hazır</b><small id="hint">İsterseniz ana ekrana uygulama olarak ekleyebilirsiniz.</small></div><button class="install" id="installBtn">Yükle</button><button class="close" id="closeBtn">✕</button></div><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{try{const d=frame.contentDocument,w=frame.contentWindow;if(!d||d.getElementById('generateBtn'))return;const st=d.createElement('style');st.textContent='.generate-wrap{margin-top:16px}.generate-btn{width:100%;border:0;border-radius:12px;padding:15px 18px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 8px 18px rgba(37,99,235,.20)}.generate-btn:active{transform:translateY(1px)}.output.generated{outline:3px solid rgba(37,99,235,.22);box-shadow:0 0 0 6px rgba(37,99,235,.06)}';d.head.appendChild(st);const note=d.querySelector('.template-note');const wrap=d.createElement('div');wrap.className='generate-wrap';wrap.innerHTML='<button class="generate-btn" id="generateBtn" type="button">Komut Oluştur</button>';if(note)note.insertAdjacentElement('afterend',wrap);else d.querySelector('.panel-inner')?.appendChild(wrap);d.getElementById('generateBtn').addEventListener('click',()=>{if(typeof w.render==='function')w.render();const out=d.getElementById('output');if(out){out.classList.remove('generated');void out.offsetWidth;out.classList.add('generated');setTimeout(()=>out.classList.remove('generated'),1400);out.scrollIntoView({behavior:'smooth',block:'start'})}if(typeof w.notify==='function')w.notify('Komut oluşturuldu.');});}catch(e){console.warn(e)}});let dp=null;const bar=document.getElementById('installBar'),btn=document.getElementById('installBtn'),hint=document.getElementById('hint');const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);if(standalone)bar.style.display='none';addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;hint.textContent='Tek dokunuşla ana ekrana yükleyebilirsiniz.'});btn.onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;bar.style.display='none';return}if(ios){hint.textContent='Safari: Paylaş → Ana Ekrana Ekle.';btn.textContent='Safari menüsü'}else{hint.textContent='Tarayıcı menüsünden “Uygulamayı yükle” veya “Ana ekrana ekle” seçeneğini kullanın.';btn.textContent='Menü'}};document.getElementById('closeBtn').onclick=()=>bar.style.display='none';addEventListener('appinstalled',()=>bar.style.display='none');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./promptlab-sw.js').catch(console.warn));</script></body></html>
