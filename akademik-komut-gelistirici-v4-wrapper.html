<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Akademik Komut Geliştirici</title><style>html,body{margin:0;height:100%;background:#f6f7fb}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}</style></head><body><iframe id="app" src="https://htmlpreview.github.io/?https://github.com/tdirsehan/tdirsehan/blob/main/akademik-komut-gelistirici-v3.html" title="Akademik Komut Geliştirici"></iframe><script>const providers={openChatGPT:['ChatGPT','https://chatgpt.com/'],openGemini:['Gemini','https://gemini.google.com/'],openClaude:['Claude','https://claude.ai/'],openGrok:['Grok','https://grok.com/']};document.getElementById('app').addEventListener('load',()=>{try{const f=document.getElementById('app'),d=f.contentDocument,w=f.contentWindow;if(!d)return;const note=d.querySelector('.note')||d.querySelector('.ai-launch-note');if(note)note.textContent='Komut önce ayrı bir “Komut Kodu” ekranında otomatik olarak gösterilir ve panoya kopyalanır. Ardından ilgili yapay zekâ sitesini açabilirsiniz.';Object.entries(providers).forEach(([id,[name,url]])=>{const old=d.getElementById(id);if(!old)return;const b=old.cloneNode(true);old.replaceWith(b);b.addEventListener('click',async()=>{if(typeof w.render==='function')w.render();let text='';try{if(typeof w.buildPrompt==='function'&&typeof w.gather==='function')text=w.buildPrompt(w.gather());}catch(e){}if(!text){const out=d.getElementById('output');text=out?out.textContent:'';}try{localStorage.setItem('akademikKomutTransfer',text)}catch(e){}try{await navigator.clipboard.writeText(text)}catch(e){}const t='https://htmlpreview.github.io/?https://github.com/tdirsehan/tdirsehan/blob/main/ai-komut-kodu.html?provider='+encodeURIComponent(name);window.open(t,'_blank','noopener,noreferrer');});});}catch(e){console.warn(e)}});</script></body></html>
