<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Komut Kodu</title><meta name="theme-color" content="#0f172a"><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0f172a0c}.k{font-size:12px;color:#667085;font-weight:800;text-transform:uppercase}h1{margin:5px 0 6px;font-size:25px}.sub{font-size:13px;color:#667085;line-height:1.45;margin-bottom:14px}textarea{width:100%;min-height:54vh;border:0;border-radius:14px;background:#0f172a;color:#e5e7eb;padding:16px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{border:1px solid #e5e7eb;border-radius:12px;padding:13px;font:inherit;font-weight:800;background:#fff;cursor:pointer}.primary{background:#2563eb;border-color:#2563eb;color:#fff}.status{min-height:20px;margin-top:9px;font-size:12px;color:#15803d}.note{margin-top:12px;padding:10px 12px;border-radius:11px;background:#eff6ff;color:#1d4ed8;font-size:12px;line-height:1.45}@media(max-width:620px){.wrap{padding:10px}.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><div class="k" id="providerLabel">Yapay zekâ aktarımı</div><h1>Komut Kodu</h1><div class="sub">Komutunuz aşağıda otomatik olarak görünür ve panoya kopyalanmaya çalışılır.</div><textarea id="code" readonly>Komut yükleniyor…</textarea><div class="actions"><button id="copyBtn">Komutu Tekrar Kopyala</button><button class="primary" id="openBtn">Yapay Zekâyı Aç</button></div><div id="status" class="status"></div><div class="note">Tarayıcı güvenliği nedeniyle başka sitenin mesaj kutusuna doğrudan yazı eklenemez. Komut burada görünür; ilgili site açıldıktan sonra mesaj alanında Yapıştır demeniz yeterlidir.</div></div></div><script>const P={ChatGPT:'https://chatgpt.com/',Gemini:'https://gemini.google.com/',Claude:'https://claude.ai/',Grok:'https://grok.com/'};const q=new URLSearchParams(location.search);let name=q.get('provider')||'ChatGPT';let text='';try{text=sessionStorage.getItem('akademikKomutTransfer')||localStorage.getItem('akademikKomutTransfer')||''}catch(e){}const code=document.getElementById('code'),status=document.getElementById('status'),openBtn=document.getElementById('openBtn');code.value=text||'Komut bulunamadı. Ana uygulamaya dönüp önce Komut Oluştur düğmesini kullanın.';document.getElementById('providerLabel').textContent=name+' için hazır';openBtn.textContent=name+'’yi Aç';async function copy(){try{await navigator.clipboard.writeText(code.value);status.textContent='Komut panoya kopyalandı.';return true}catch(e){try{code.removeAttribute('readonly');code.select();const ok=document.execCommand('copy');code.setAttribute('readonly','');status.textContent=ok?'Komut panoya kopyalandı.':'Komutu elle kopyalayın.';return ok}catch(e2){status.textContent='Komutu elle kopyalayın.';return false}}}document.getElementById('copyBtn').onclick=copy;openBtn.onclick=async()=>{await copy();window.open(P[name]||P.ChatGPT,'_blank','noopener,noreferrer');status.textContent=name+' açıldı. Mesaj alanına Yapıştır deyin.'};addEventListener('load',copy);</script></body></html>
