<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PromptLab</title><link rel="manifest" href="./promptlab-manifest.webmanifest"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="PromptLab"><link rel="icon" href="./promptlab-icon.svg" type="image/svg+xml"><style>html,body{margin:0;height:100%;background:#f6f7fb;font-family:system-ui,-apple-system,sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}.bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:20;display:flex;gap:10px;align-items:center;background:#0f172a;color:#fff;padding:11px 12px;border-radius:15px;box-shadow:0 10px 30px #0003}.txt{flex:1;font-size:12px;line-height:1.3}.txt small{display:block;color:#cbd5e1;margin-top:3px}.bar button{border:0;border-radius:10px;padding:9px 12px;font-weight:700}.install{background:#2563eb;color:#fff}.close{background:transparent;color:#cbd5e1}@media(min-width:800px){.bar{max-width:620px;left:50%;right:auto;transform:translateX(-50%)}}</style></head><body><iframe id="app" src="./promptlab.html" title="PromptLab"></iframe><div class="bar" id="installBar"><div class="txt"><b>PromptLab hazır</b><small id="hint">İlk açılışta gerekli dosyalar çevrimdışı kullanım için önbelleğe alınır.</small></div><button class="install" id="installBtn">Yükle</button><button class="close" id="closeBtn">✕</button></div><script>let dp=null;const bar=document.getElementById('installBar'),btn=document.getElementById('installBtn'),hint=document.getElementById('hint');const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);if(standalone)bar.style.display='none';addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;hint.textContent='Tek dokunuşla ana ekrana yükleyebilirsiniz.'});btn.onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;bar.style.display='none';return}if(ios){hint.textContent='Safari: Paylaş → Ana Ekrana Ekle.';btn.textContent='Safari menüsü'}else{hint.textContent='Tarayıcı menüsünden “Uygulamayı yükle” veya “Ana ekrana ekle” seçeneğini kullanın.';btn.textContent='Menü'}};document.getElementById('closeBtn').onclick=()=>bar.style.display='none';addEventListener('appinstalled',()=>bar.style.display='none');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./promptlab-sw.js').catch(console.warn));</script></body></html>
